services:
  student-app:
    build: .
    image: bazarali-daulet-devops
    container_name: bazarali-daulet-container
    ports:
      - "8085:8080"
    environment:
      STUDENT_NAME: "Daulet"
      STUDENT_SURNAME: "Bazarali"
      STUDENT_GROUP: "IT2-2308"
      STUDENT_ID: "37392"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
